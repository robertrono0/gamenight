<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%93%9C%3C/text%3E%3C/svg%3E"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Night Recap</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400..700&display=swap" rel="stylesheet"><style id="tgShellCss">
:root{--gold:#ffcc3d;--gold2:#ffa51f;--cream:#fff3dc;--ink:#2a0d12;--fd:'Bungee','Impact',sans-serif;--fb:'Fredoka','Segoe UI',system-ui,sans-serif;--t0:#2ec4b6;--t1:#ff4d6d;--t2:#a78bfa;--t3:#ffb703;--ok:#3ddc84;--bad:#ff4d4d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0b0718;color:var(--cream);font-family:var(--fb)}
button{font-family:var(--fb);cursor:pointer;border:0}input,textarea,select{font-family:var(--fb)}
.hidden{display:none!important}
#bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 115%,var(--bgA,#5b1f9a) 0%,var(--bgB,#2a1050) 38%,#0b0718 78%)}
#bg::before{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg at 50% 60%,rgba(255,204,61,.05) 0 6deg,transparent 6deg 18deg);animation:cspin 70s linear infinite}
@keyframes cspin{to{transform:rotate(360deg)}}
#fx{position:fixed;inset:0;z-index:60;pointer-events:none}
#app{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;gap:1.4vh;padding:1.4vh 1.6vw}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:1vw}
.title{font-family:var(--fd);font-size:4.2vh;background:linear-gradient(180deg,#fff6c9,var(--gold) 45%,var(--gold2) 70%,#d1560c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .35vh 0 #5a1505) drop-shadow(0 0 1.4vh rgba(255,170,40,.4));white-space:nowrap}
.tools{display:flex;gap:.5vw}
.ib{width:5vh;height:5vh;border-radius:1.4vh;background:rgba(255,243,220,.12);color:var(--cream);font-size:2.4vh;display:grid;place-items:center;border:1px solid rgba(255,243,220,.18);text-decoration:none}
.ib:hover{background:rgba(255,204,61,.3)}.ib.off{opacity:.4}
.scores{display:flex;gap:1vw;justify-content:center;flex-wrap:wrap}
.sc{--tc:var(--t0);min-width:15vw;flex:1;max-width:30vw;border-radius:2vh;padding:.8vh 1.2vw;background:rgba(255,255,255,.06);border:.35vh solid var(--tc);display:flex;justify-content:space-between;align-items:center;gap:1vw;transition:.35s}
.sc .n{font-family:var(--fd);font-size:2.2vh;color:var(--tc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sc .m{font-size:1.5vh;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:20vw}
.sc .s{font-family:var(--fd);font-size:4.2vh}
.sc.on{background:color-mix(in srgb,var(--tc) 32%,transparent);box-shadow:0 0 3vh var(--tc);transform:scale(1.04)}
.sc.pop .s{animation:spop .6s}@keyframes spop{40%{transform:scale(1.5);color:var(--gold)}}
.bb{font-family:var(--fd);font-size:2.1vh;padding:1.1vh 2.2vh;border-radius:1.6vh;background:linear-gradient(#ff8a2a,#d9480f);color:#fff;box-shadow:0 .6vh 0 #8a3a07,0 1vh 2vh rgba(0,0,0,.35);transition:transform .1s}
.bb:active{transform:translateY(.4vh);box-shadow:0 .2vh 0 #8a3a07}
.bb.gold{background:linear-gradient(var(--gold),var(--gold2));color:var(--ink)}.bb.ghost{background:rgba(255,255,255,.12);color:var(--cream);box-shadow:0 .5vh 0 rgba(0,0,0,.3)}
.bb.ok{background:linear-gradient(#5cf09a,#16a35a);box-shadow:0 .6vh 0 #0b5a31}.bb.bad{background:linear-gradient(#ff6b6b,#d12b2b);box-shadow:0 .6vh 0 #7a1010}
.bb.big{font-size:3vh;padding:1.6vh 3.4vh;border-radius:2.2vh}
.bb:hover{filter:brightness(1.08)}.bb:disabled{opacity:.4;pointer-events:none}
.btns{display:flex;gap:.8vw;flex-wrap:wrap;justify-content:center}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;position:relative}
.panel{border-radius:3vh;padding:3vh 3vw;background:linear-gradient(180deg,rgba(0,0,0,.38),rgba(0,0,0,.2));border:.3vh solid rgba(255,204,61,.4);box-shadow:0 2vh 5vh rgba(0,0,0,.4),inset 0 0 6vh rgba(255,204,61,.06);text-align:center}
.kicker{font-weight:700;letter-spacing:.3em;font-size:1.9vh;color:var(--gold)}
.huge{font-family:var(--fd);font-size:9vh;line-height:1.05;text-shadow:0 .6vh 0 rgba(0,0,0,.4)}
.status{font-size:2.3vh;font-weight:700;text-align:center;min-height:3vh}.status b{color:var(--gold)}
.ring{--p:1;--rc:var(--gold);width:14vh;height:14vh;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--rc) calc(var(--p)*360deg),rgba(255,255,255,.1) 0);transition:--p .2s}
.ring span{width:11.4vh;height:11.4vh;border-radius:50%;background:#2a0d12;display:grid;place-items:center;font-family:var(--fd);font-size:5vh}
.ring.low{--rc:#ff4d4d;animation:rpulse .5s infinite alternate}@keyframes rpulse{to{box-shadow:0 0 4vh #ff4d4d}}
.t2{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%) scale(0);z-index:50;font-family:var(--fd);font-size:6.4vh;text-align:center;padding:2.4vh 4vw;border-radius:3vh;background:rgba(20,6,10,.95);border:.4vh solid var(--gold);box-shadow:0 0 6vh rgba(255,204,61,.5);transition:transform .45s cubic-bezier(.3,1.6,.5,1);pointer-events:none;max-width:90vw}
.t2.on{transform:translate(-50%,-50%) scale(1)}.t2 small{display:block;font-family:var(--fb);font-size:2.5vh;margin-top:.8vh}
#toast{position:fixed;left:50%;bottom:10vh;transform:translateX(-50%) translateY(20vh);background:var(--gold);color:var(--ink);font-weight:700;font-size:2.4vh;padding:1.2vh 2.6vh;border-radius:3vh;z-index:90;transition:.4s}#toast.on{transform:translateX(-50%)}
.ov{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,rgba(74,20,32,.97),rgba(20,6,10,.985));overflow:auto;padding:2vh 0}
.card{width:min(1100px,94vw);max-height:94vh;overflow:auto;padding:3vh 3vw;border-radius:3vh;background:linear-gradient(180deg,#fff7e6,#ffe9c4);color:var(--ink);box-shadow:0 0 0 .6vh var(--gold),0 0 0 1.2vh #8a3a07,0 3vh 6vh rgba(0,0,0,.6)}
.card h2{font-family:var(--fd);font-size:3.6vh;color:#c2410c;text-align:center;margin-bottom:1vh}.card h3{font-size:2.1vh;margin:1.6vh 0 .7vh;color:#7a2410}
.hint{font-size:1.7vh;opacity:.75;font-weight:400}
.field{width:100%;padding:1vh 1.2vh;border-radius:1.2vh;border:.25vh solid #e8b77a;background:#fff;font-size:2vh;color:var(--ink)}
textarea.field{min-height:11vh;resize:vertical;line-height:1.45}
.seg{display:inline-flex;border-radius:1.4vh;overflow:hidden;border:.25vh solid #e8b77a;flex-wrap:wrap}.seg button{padding:1vh 1.8vh;font-size:1.9vh;font-weight:700;background:#fff;color:var(--ink)}.seg button.on{background:#ff7a1a;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:.8vh}.chip{padding:.8vh 1.4vh;border-radius:3vh;background:#fff;border:.25vh solid #e8b77a;font-weight:700;font-size:1.8vh;color:var(--ink)}.chip.on{background:#ff7a1a;color:#fff;border-color:#c2410c}
.teamsPrev{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1vh;margin-top:1vh}.teamsPrev div{border-radius:1.4vh;padding:1vh;background:#fff;border-left:1vh solid var(--tc);font-size:1.8vh}.teamsPrev b{color:var(--tc);filter:brightness(.7)}
.ctr{display:flex;justify-content:center;gap:1vw;margin-top:2vh;flex-wrap:wrap}
.howg{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4vh 1.4vw}.hc{background:#fff;border-radius:2vh;padding:1.6vh 1.2vw;font-size:2vh;line-height:1.4;box-shadow:0 .5vh 0 #e8b77a}.hc .i{font-size:4vh;display:block}.hc b{color:#c2410c}
.endWrap{width:min(1300px,96vw);text-align:center}
.bigT{font-family:var(--fd);font-size:6.4vh;color:var(--gold);text-shadow:0 .6vh 0 #8a3a07,0 0 3vh rgba(255,204,61,.5)}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:2vw;margin:3vh 0}
.pod{--tc:var(--t0);width:22vw;border-radius:2.4vh 2.4vh 0 0;background:color-mix(in srgb,var(--tc) 30%,#2a0d12);border:.4vh solid var(--tc);padding:2vh 1vw;display:flex;flex-direction:column;justify-content:flex-start;animation:rise 1s cubic-bezier(.3,1.4,.5,1) backwards}
.pod h4{font-family:var(--fd);font-size:3vh;color:var(--tc);filter:brightness(1.2)}.pod .s{font-family:var(--fd);font-size:6vh}.pod p{font-size:1.9vh;opacity:.9}.pod .md{font-size:7vh}
@keyframes rise{from{transform:translateY(60vh)}}
.countdown{position:fixed;inset:0;z-index:45;display:grid;place-items:center;pointer-events:none}
.countdown span{font-family:var(--fd);font-size:30vh;color:var(--gold);text-shadow:0 0 6vh rgba(255,204,61,.7),0 1.4vh 0 #8a3a07;animation:cd .9s ease-out forwards}
@keyframes cd{0%{transform:scale(2.5);opacity:0}25%{transform:scale(1);opacity:1}100%{transform:scale(.7);opacity:0}}
.flipIn{animation:flipIn .6s cubic-bezier(.3,1.5,.5,1)}@keyframes flipIn{from{transform:rotateX(90deg) scale(.6);opacity:0}}
.popIn{animation:popIn .5s cubic-bezier(.3,1.6,.5,1)}@keyframes popIn{from{transform:scale(.3);opacity:0}}
.bz{font-size:1.7vh;opacity:.8}.bz a{color:var(--gold)}
.falling{position:fixed;top:-8vh;z-index:0;font-size:4vh;pointer-events:none;animation:fall linear forwards;opacity:.5}@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
.subT{font-size:2.6vh;opacity:.9;margin:1vh 0 2vh}

</style>
<style>html,body{overflow:auto!important}#app{height:auto;min-height:100vh}.stage{justify-content:flex-start;padding-bottom:6vh}
.champ{text-align:center}.champ .av{width:24vh;height:24vh;font-size:10vh;border:1vh solid #ffcc3d;box-shadow:0 0 6vh rgba(255,204,61,.7)}
.crown{font-size:12vh;line-height:.6;animation:popIn 1s}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.4vh 1.2vw;width:min(1500px,94vw)}
.cardR{background:rgba(255,255,255,.08);border-radius:2vh;padding:1.6vh 1.4vw;border:.25vh solid rgba(255,204,61,.35)}.cardR h4{font-family:var(--fd);color:var(--gold);font-size:2.2vh;margin-bottom:.8vh}
.row{display:flex;align-items:center;gap:.8vw;font-size:2vh;margin:.4vh 0}.row b{margin-left:auto;font-family:var(--fd)}</style></head><body><div id="bg"></div><canvas id="fx"></canvas><div class="t2" id="t2"></div><div id="toast"></div>
<div id="app"><div class="hdr"><div class="title">📜 GAME NIGHT RECAP</div><div class="tools"><a class="ib" href="index.html" title="All games">🏠</a><button class="ib musicBtn" title="Music">🎵</button><button class="ib" id="bFull" title="Full screen">⛶</button></div></div><div class="stage" id="stage"></div></div>
<script src="tg-shell.js?v=1115d"></script><script>
/*tgNorm*/(function(){try{const J=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
const R=J('tg-roster')||[],N=J('tg-night');const pick={};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
R.forEach(n=>{const k=String(n).trim().toLowerCase();if(k&&!pick[k])pick[k]=String(n).trim()});
if(N&&N.log){N.log.forEach(e=>Object.keys(e.aw||{}).forEach(n=>{const k=n.trim().toLowerCase();if(!pick[k]||(pick[k]===pick[k].toLowerCase()&&n!==n.toLowerCase()))if(!R.some(r=>String(r).trim().toLowerCase()===k))pick[k]=n.trim()}));
 Object.keys(pick).forEach(k=>{if(pick[k]===pick[k].toLowerCase())pick[k]=cap(pick[k])});
 let ch=false;N.log.forEach(e=>{const a={};Object.entries(e.aw||{}).forEach(([n,p])=>{const c=pick[n.trim().toLowerCase()]||n;if(c!==n)ch=true;a[c]=(a[c]||0)+p});e.aw=a});
 if(ch)localStorage.setItem('tg-night',JSON.stringify(N))}
const seen=new Set(),R2=[];R.forEach(n=>{const c=pick[String(n).trim().toLowerCase()]||String(n).trim();const k=c.toLowerCase();if(c&&!seen.has(k)){seen.add(k);R2.push(c)}});
if(JSON.stringify(R2)!==JSON.stringify(R))localStorage.setItem('tg-roster',JSON.stringify(R2));
['tg-avatars','tg-profiles'].forEach(key=>{const A=J(key);if(!A)return;let c3=false;Object.keys(A).forEach(n=>{const c=pick[n.trim().toLowerCase()];if(c&&c!==n){if(!A[c])A[c]=A[n];delete A[n];c3=true}});if(c3)localStorage.setItem(key,JSON.stringify(A))});
const T=J('tg-night-teams');if(T&&T.teams){let ch2=false;T.teams.forEach(t=>{const s=new Set();t.m=t.m.map(n=>{const c=pick[String(n).trim().toLowerCase()]||n;if(c!==n)ch2=true;return c}).filter(n=>{const k=n.toLowerCase();if(s.has(k)){ch2=true;return false}s.add(k);return true})});if(ch2)localStorage.setItem('tg-night-teams',JSON.stringify(T))}
}catch(e){}})();
const N=LS.get('tg-night',{log:[]}),AV=LS.get('tg-avatars',{}),PR=LS.get('tg-profiles',{});
const av=n=>AV[n]?`<img class="av" src="${AV[n]}">`:`<span class="av avL">${esc((n[0]||'?').toUpperCase())}</span>`;
const t={},wins={},games={};N.log.forEach(e=>{games[e.game]=games[e.game]||[];Object.entries(e.aw||{}).forEach(([n,p])=>{t[n]=(t[n]||0)+p;if(p>=5)wins[n]=(wins[n]||0)+1;games[e.game].push([n,p])})});
const ranked=Object.entries(t).sort((a,b)=>b[1]-a[1]);const date=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});
const st=$('#stage');
if(!ranked.length){st.innerHTML=`<div class="bigT">No games scored yet!</div><div class="status">Play some games and come back for the recap. 🎮</div>`}
else{const[c,cp]=ranked[0];const most=Object.entries(wins).sort((a,b)=>b[1]-a[1])[0];
 st.innerHTML=`<div class="kicker">${esc(date)}</div><div class="champ"><div class="crown">👑</div>${av(c)}<div class="bigT">${esc(c.toUpperCase())}</div><div class="status">GAME NIGHT CHAMPION · ${cp} points</div></div>
 <div class="cards"><div class="cardR"><h4>🏆 Final standings</h4>${ranked.map(([n,p],i)=>`<div class="row">${['🥇','🥈','🥉'][i]||i+1} ${av(n).replace('class="av','style="width:3.4vh;height:3.4vh;font-size:1.6vh" class="av')} ${esc(n)}<b>${p}</b></div>`).join('')}</div>
 <div class="cardR"><h4>🎮 Game winners</h4>${Object.entries(games).map(([g,arr])=>{const top=arr.filter(x=>x[1]>=5).map(x=>x[0]);return`<div class="row">${esc(g)}<b style="font-family:var(--fb)">${top.length?top.map(esc).join(', '):'—'}</b></div>`}).join('')}</div>
 <div class="cardR"><h4>✨ Night stats</h4><div class="row">🎮 Games played<b>${Object.keys(games).length}</b></div><div class="row">👥 Players who scored<b>${ranked.length}</b></div>${most?`<div class="row">🥇 Most wins<b style="font-family:var(--fb)">${esc(most[0])} (${most[1]})</b></div>`:''}<div class="row">🧒 Kids playing<b>${Object.values(PR).filter(p=>p.a==='kid').length}</b></div><div class="row">💯 Total points handed out<b>${Object.values(t).reduce((a,b)=>a+b,0)}</b></div></div></div>
 <div class="hint" style="font-size:1.8vh">📸 Tip: take a screenshot of this page and send it to the group chat!</div>`;
 setTimeout(()=>{if(window.FXX)FXX.bigWin('👑 '+c.toUpperCase(),cp+' pts','Game Night Champion!');else burst()},600)}
shellInit({game:'Recap',style:'pop'});
</script><script src="tg-depth.js?v=1115d"></script><script src="tg-night.js?v=1115d"></script></body></html>
